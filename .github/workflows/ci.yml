name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  smoke-tests:
    name: Smoke tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest (smoke suite)
        run: |
          pytest tests/test_smoke.py -v

      - name: Run the demo end-to-end
        run: |
          mkdir -p /tmp/pyc-demo
          python -m pycontourlet --out-dir /tmp/pyc-demo
          test -f /tmp/pyc-demo/reconstruction.png
          test -f /tmp/pyc-demo/coefficients.png
          test -f /tmp/pyc-demo/nla_comparison.png

  parity-tests:
    name: Octave parity tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Octave
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends octave liboctave-dev

      - name: Download MATLAB Contourlet Toolbox
        run: |
          curl -fsSL -o /tmp/contourlet_toolbox.tar \
            https://minhdo.ece.illinois.edu/software/contourlet_toolbox.tar
          mkdir -p $HOME/contourlet_toolbox
          tar -xf /tmp/contourlet_toolbox.tar -C $HOME/contourlet_toolbox

      - name: Build resampc.mex with string.h fix
        run: |
          cp $HOME/contourlet_toolbox/resampc.c /tmp/resampc.c
          sed -i 's|#include "mex.h"|#include "mex.h"\n#include <string.h>|' /tmp/resampc.c
          mkoctfile --mex /tmp/resampc.c -o $HOME/contourlet_toolbox/resampc

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate Octave fixtures
        run: |
          octave --no-gui --eval \
            "addpath('$HOME/contourlet_toolbox'); \
             addpath('tests/octave'); \
             generate_fixtures('tests/fixtures')"

      - name: Run pytest (full suite, smoke + parity)
        run: |
          pytest tests/ -v
